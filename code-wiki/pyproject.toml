[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-wiki"
version = "0.1.0"
description = "Code analysis agent: workspace + question → find code → answer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
code-wiki = "code_wiki.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/code_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
